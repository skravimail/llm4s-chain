# l4j-template runtime configuration.
#
# Keys live in .env (so they stay gitignored). Everything else lives here
# and can be committed.
#
# Each provider has a default base_url and a conventional env-var that
# AppConfig reads for the API key:
#   gemini -> https://generativelanguage.googleapis.com/v1beta/openai , GOOGLE_API_KEY
#   openai -> https://api.openai.com/v1                                , OPENAI_API_KEY
#   ibm    -> (no default; set base_url explicitly)                    , IBM_API_KEY
#   ollama -> http://localhost:11434/v1                                , (none required)
#   omlx   -> http://localhost:1337                                    , OMLX_API_KEY (any)
#
# Override base_url to point at a non-standard endpoint (e.g. a self-hosted
# proxy). Leave it unset to use the provider default.

llm:
  provider: gemini          # gemini | openai | ibm | ollama | omlx
  model: gemini-2.5-flash

  # response_format_mode: how to encode the `response_format` field for
  # chatAs[T]. Strict-schema servers (real OpenAI, Gemini) handle
  # json_schema fine. Older / local servers (osaurus, older LM Studio,
  # llama.cpp) need json_object or disabled. See PR-18 in CODE_REVIEW.md.
  response_format_mode: json_schema   # json_schema | json_object | disabled

  # request_timeout_seconds: wall-clock cap on a single provider call.
  # Bump to 300+ for slow local models generating structured output. PR-19.
  request_timeout_seconds: 60

  # base_url: override the provider's default endpoint. Leave commented to
  # use the default for `provider:`.
  # base_url: http://127.0.0.1:1337
